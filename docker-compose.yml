# Local/self-hosted stack: Postgres + web + background worker.
# Secrets come from .env (never commit it). See .env.example.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: roam
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-roam}
      POSTGRES_DB: roam
    volumes: [pgdata:/var/lib/postgresql/data]
  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://roam:${POSTGRES_PASSWORD:-roam}@db:5432/roam
    ports: ["3000:3000"]
    volumes: [storage:/app/storage]
    depends_on: [db]
  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://roam:${POSTGRES_PASSWORD:-roam}@db:5432/roam
    command: ["npm", "run", "worker"]
    volumes: [storage:/app/storage]
    depends_on: [db, web]
volumes:
  pgdata:
  storage:
