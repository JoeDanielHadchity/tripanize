# Local/self-hosted stack: Postgres + web + background worker.
# Secrets come from .env (never commit it). See .env.example.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: tripanize
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tripanize}
      POSTGRES_DB: tripanize
    volumes: [pgdata:/var/lib/postgresql/data]
  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://tripanize:${POSTGRES_PASSWORD:-tripanize}@db:5432/tripanize
    ports: ["3000:3000"]
    volumes: [storage:/app/storage]
    depends_on: [db]
  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://tripanize:${POSTGRES_PASSWORD:-tripanize}@db:5432/tripanize
    command: ["npm", "run", "worker"]
    volumes: [storage:/app/storage]
    depends_on: [db, web]
volumes:
  pgdata:
  storage:
