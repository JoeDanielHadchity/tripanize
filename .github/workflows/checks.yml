name: Checks

# Type checks and the test suite for the website/server and the app, on every
# push to main and to claude/* work branches, before changes go live.
on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
      - run: npm ci
      # Some integration tests import app code, which needs the app's packages and tsconfig.
      - run: npm ci --prefix mobile
      - run: npx prisma generate
      - name: Type check
        run: npx tsc --noEmit
      - name: Tests
        run: npx vitest run

  app:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Lint
        run: npx expo lint
